<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Central Climate - Redesigned Card v5 Live Interactive Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./smart-central-climate-card.js"></script>
  <style>
    body {
      background-color: #0b0e14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- WRAPPER -->
  <div class="w-full max-w-lg space-y-6">

    <!-- DEMO BANNER -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div>
        <h1 class="text-xl font-bold text-white flex items-center gap-2">
          <span>🌀</span> Smart Central Climate Card v5
        </h1>
        <p class="text-xs text-slate-400">Interactive Lovelace Custom Component Preview</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
          PROD RELEASE v1.5.0
        </span>
      </div>
    </div>

    <!-- THE CUSTOM LOVELACE COMPONENT -->
    <div id="card-mount">
      <smart-central-climate-card id="climate-card"></smart-central-climate-card>
    </div>

    <!-- INTERACTIVE SIMULATION PANEL -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 space-y-3 text-xs">
      <div class="font-bold text-slate-300 uppercase tracking-wider text-[11px] flex items-center justify-between">
        <span>⚙️ Live Entity Simulator</span>
        <span class="text-sky-400">Connected to Mock HASS State</span>
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-slate-400 mb-1">Simulate Room Temp (°F):</label>
          <input type="range" id="sim-temp" min="60" max="85" step="0.5" value="68.4" class="w-full accent-sky-400" oninput="updateSimState()">
          <div class="flex justify-between text-[10px] text-slate-500 mt-0.5">
            <span>60°F</span>
            <span id="sim-temp-display" class="font-bold text-slate-200">68.4°F</span>
            <span>85°F</span>
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">Simulate HVAC Action:</label>
          <select id="sim-action" onchange="updateSimState()" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg p-1.5">
            <option value="idle">Idle (Green Thermometer)</option>
            <option value="cooling">Cooling (Blue Snowflake)</option>
            <option value="heating">Heating (Red Flame)</option>
            <option value="off">Off (Gray Standby)</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-slate-800/80 text-[11px] text-slate-400">
        <span>Drag knobs on the circular arc to adjust setpoints</span>
        <button onclick="resetDefaults()" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold transition-all">
          Reset Defaults
        </button>
      </div>
    </div>

  </div>

  <script>
    // Mock Home Assistant State Store
    const mockHass = {
      states: {
        "climate.smart_central_climate": {
          entity_id: "climate.smart_central_climate",
          state: "heat_cool",
          attributes: {
            friendly_name: "Smart Central Climate",
            current_temperature: 68.4,
            target_temp_low: 64.0,
            target_temp_high: 74.0,
            temperature: 70.0,
            hvac_action: "idle",
            hvac_modes: ["heat_cool", "cool", "heat", "off"],
            preset_mode: "comfort",
            preset_modes: ["eco", "comfort", "sleep", "away", "vacation", "none"],
            fan_mode: "on",
            fan_state: "on",
            indoor_humidity: 48,
            return_air_temperature: 68.2,
            return_air_humidity: 49,
            supply_air_temperature: 52.4,
            supply_air_humidity: 65,
            delta_t: -15.8,
            wall_thermostat_temperature: 69.0,
            wall_thermostat_humidity: 45
          }
        }
      },
      callService(domain, service, data) {
        console.log(`[Mock HASS Service Call] ${domain}.${service}:`, data);
        const entity = mockHass.states[data.entity_id || "climate.smart_central_climate"];
        if (!entity) return;

        if (domain === "climate") {
          if (service === "set_hvac_mode") {
            entity.state = data.hvac_mode;
            if (data.hvac_mode === "off") entity.attributes.hvac_action = "off";
            else if (data.hvac_mode === "cool") entity.attributes.hvac_action = "cooling";
            else if (data.hvac_mode === "heat") entity.attributes.hvac_action = "heating";
            else entity.attributes.hvac_action = "idle";
          } else if (service === "set_preset_mode") {
            entity.attributes.preset_mode = data.preset_mode;
          } else if (service === "set_fan_mode") {
            entity.attributes.fan_mode = data.fan_mode;
            entity.attributes.fan_state = data.fan_mode;
          } else if (service === "set_temperature") {
            if (data.target_temp_low !== undefined) entity.attributes.target_temp_low = data.target_temp_low;
            if (data.target_temp_high !== undefined) entity.attributes.target_temp_high = data.target_temp_high;
            if (data.temperature !== undefined) entity.attributes.temperature = data.temperature;
            entity.attributes.preset_mode = "none";
          }
        } else if (domain === "switch") {
          entity.attributes.fan_state = service === "turn_on" ? "on" : "off";
          entity.attributes.fan_mode = entity.attributes.fan_state;
        }

        // Push state update to card
        const card = document.getElementById('climate-card');
        if (card) card.hass = { ...mockHass };
      }
    };

    function initCard() {
      const card = document.getElementById('climate-card');
      card.setConfig({
        entity: "climate.smart_central_climate",
        name: "Smart Central Climate",
        min_temp: 60,
        max_temp: 85
      });
      card.hass = { ...mockHass };
    }

    function updateSimState() {
      const t = parseFloat(document.getElementById('sim-temp').value);
      const action = document.getElementById('sim-action').value;
      document.getElementById('sim-temp-display').textContent = t.toFixed(1) + '°F';

      const entity = mockHass.states["climate.smart_central_climate"];
      entity.attributes.current_temperature = t;
      entity.attributes.hvac_action = action;
      
      const card = document.getElementById('climate-card');
      card.hass = { ...mockHass };
    }

    function resetDefaults() {
      const entity = mockHass.states["climate.smart_central_climate"];
      entity.state = "heat_cool";
      entity.attributes.current_temperature = 68.4;
      entity.attributes.target_temp_low = 64.0;
      entity.attributes.target_temp_high = 74.0;
      entity.attributes.hvac_action = "idle";
      entity.attributes.fan_mode = "on";
      entity.attributes.fan_state = "on";
      entity.attributes.preset_mode = "comfort";

      document.getElementById('sim-temp').value = 68.4;
      document.getElementById('sim-temp-display').textContent = '68.4°F';
      document.getElementById('sim-action').value = 'idle';

      const card = document.getElementById('climate-card');
      card.hass = { ...mockHass };
    }

    window.addEventListener('DOMContentLoaded', initCard);
  </script>
</body>
</html>
